services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-router-saas-app
    ports:
      - "3001:3000"
    environment:
      # Database (use your Supabase connection string)
      - DATABASE_URL=${DATABASE_URL}
      
      # Required secrets
      - COOKIE_SECRET=${COOKIE_SECRET:-change-me-in-production}
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY:-change-me-in-production}
      
      # Node environment
      - NODE_ENV=production
      
      # Optional: Mailgun (if you want to test email features)
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      
      # Optional: Stripe (if you want to test payment features)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      
      # Puppeteer configuration (already set in Dockerfile, but can override)
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    env_file:
      - .env
    restart: unless-stopped
    # Health check to ensure the app is running
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
